<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蛊真人</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 开始页：方源重生背景 ============ -->
<div class="screen home" id="screen-start">
  <div class="title">
    <svg class="main" fill="currentColor" viewBox="0 0 31 15"><text font-size="10" style="transform: translate(50%, 50%); text-anchor: middle; dominant-baseline: central;">蛊真人</text></svg>
    <svg class="sub" fill="currentColor" viewBox="0 0 120 15"><text font-size="10" style="transform: translate(50%, 50%); text-anchor: middle; dominant-baseline: central;">炼蛊炼人还炼天</text></svg>
  </div>
  <div style="color:var(--g0);line-height:1.9;text-align:center;max-width:36rem">
    你从五百年后重生，这一世，你将随机降生于五域之一。<br>
    前世你是炼天魔尊，这一世，你带着六转仙蛊「春秋蝉」重活一世，<br>
    誓要挣脱命运的束缚。
  </div>
  <div class="controls"><div><button class="primary focus" onclick="startNew()">开始</button></div></div>
</div>

<!-- ============ 蛊虫选择 ============ -->
<div class="screen hidden" id="screen-gupick">
  <div class="sec">选一只初始蛊虫</div>
  <div style="color:var(--g0);font-size:.9rem">你已拥有六转仙蛊「春秋蝉」，请从下列五只一转蛊虫中选一只作为起步蛊。</div>
  <div id="guList"></div>
</div>

<!-- ============ 加点 ============ -->
<div class="screen hidden" id="screen-alloc">
  <div class="sec">分配属性</div>
  <div class="alloc" id="allocPanel"></div>
  <div class="controls" style="width:100%;justify-content:center;gap:.5rem">
    <button class="secondary" onclick="randomAlloc()">随机分配</button>
    <button class="primary" id="btnStart" onclick="startLife()">开始修炼</button>
  </div>
</div>

<!-- ============ 初始界面（剧情页）：左侧状态栏，中间日志+控制，右侧属性圆环 ============ -->
<div class="screen play hidden" id="screen-play">
  <div class="play-left">
    <div id="status"></div>
  </div>
  <div class="play-main">
    <div id="saveNotice" class="hidden" role="alert"></div><div class="activity-actions"><button onclick="openActivities()">寻蛊与历练</button><button onclick="openActivities('forge')">炼蛊</button><button onclick="openActivities('infer')">推演</button><button onclick="openActivities('shop')">宝黄天</button><button onclick="openActivities('rest')">休养</button><button onclick="openWarehouse()">仓库与供养</button></div><ul class="logs" id="log"></ul>
    <div class="controls" style="width:100%">
      <button id="btnPause">⏸ 暂停</button>
      <button id="btn1x" class="active">1x</button>
      <button id="btn2x">2x</button>
      <button id="btn4x">4x</button>
      <button id="btnNext" class="primary">下一步</button>
    </div>
  </div>
  <div class="play-side">
    <ul class="attr-circles" id="attrs"></ul>
  </div>
</div>

<!-- 宝黄天：与人生页同级的独立页面，不使用遮罩或弹窗。 -->
<section class="screen forge-screen hidden" id="screen-forge" aria-label="炼蛊坊">
  <header class="forge-header"><div><p class="shop-eyebrow">择材入炉 · 炼蛊求真</p><h1>炼蛊坊</h1><p id="forgeBalance"></p></div><div class="forge-actions"><button onclick="openForgeShop()">宝黄天补货</button><button onclick="openWarehouse()">查看仓库</button><button onclick="closeForge()">返回人生</button></div></header>
  <p id="forgeMessage" role="status" aria-live="polite"></p>
  <div class="forge-layout">
    <section class="forge-inventory forge-card" aria-label="材料仓库"><h2>材料仓库</h2><p class="forge-hint">勾选具体蛊虫，或填写材料份数。准备时不扣除库存。</p><div class="forge-tabs"><button id="forgeGuTab" onclick="forgeSelectCategory('gu')">蛊虫</button><button id="forgeMaterialTab" onclick="forgeSelectCategory('material')">材料</button></div><input class="forge-search" type="search" aria-label="查找材料" placeholder="按名称查找" oninput="forgeSearch(this.value)"><div id="forgeInventory"></div></section>
    <section class="forge-furnace forge-card" aria-label="炼炉"><h2>本次炼炉</h2><div id="forgeInputs"></div><div id="forgeRisk"></div><p id="forgeIssue" class="forge-warning"></p><button class="primary" id="forgeBegin" onclick="prepareForge()">检查投入与风险</button><div id="forgeConfirm" aria-live="polite"></div><div id="forgeResult" aria-live="polite"></div></section>
    <aside class="forge-recipes forge-card" aria-label="配方册"><h2>配方册</h2><div id="forgeRecipe"></div></aside>
  </div>
</section>
<section class="screen shop-screen hidden" id="screen-shop" aria-label="宝黄天">
  <button id="shopReturnForge" class="hidden" onclick="openForge()">返回炼蛊坊（保留投料）</button>
  <header class="shop-header"><div><p class="shop-eyebrow">万物可易 · 各取所需</p><h1>宝黄天</h1><p id="shopBalance"></p></div><div class="shop-header-actions"><button onclick="openWarehouse()">查看仓库</button><button onclick="closeShop()">返回人生</button></div></header>
  <nav class="shop-grades" id="shopGrades" aria-label="交易分区"></nav>
  <nav class="shop-categories" id="shopCategories" aria-label="商品分类"></nav>
  <p id="shopIntro"></p>
  <p id="shopMessage" class="shop-message" role="status" aria-live="polite"></p>
  <div class="shop-grid" id="shopGrid"></div>
  <div class="shop-pagination"><button id="shopPrev" onclick="shopChangePage(-1)">上一页</button><span id="shopPage"></span><button id="shopNext" onclick="shopChangePage(1)">下一页</button></div>
  <p class="shop-footnote">购买后收入仓库。浏览期间时间暂停，返回人生后可继续推进。</p>
</section>

<!-- ============ 蛊虫仓库（5×6 网格） ============ -->
<div class="overlay hidden" id="warehouse">
  <div class="warehouse-panel">
    <div class="sec">蛊虫仓库</div>
    <div class="controls warehouse-nav" style="align-items:center">
      <button id="warehousePrev" onclick="warehousePrev()">上一页</button>
      <span class="font-mono" id="warehousePage"></span>
      <button id="warehouseNext" onclick="warehouseNext()">下一页</button>
      <button onclick="closeWarehouse()">关闭</button>
    </div>
    <div class="warehouse-grid" id="warehouseGrid"></div>
    <div id="warehouseFood"></div>
    <div id="warehouseRecipes"></div>
    <div id="warehouseShopStock"></div>
  </div>
</div>

<!-- ============ 死亡抉择 / 继承面板（重生系统） ============ -->
<div class="overlay hidden" id="deathPanel">
  <div class="warehouse-panel" id="deathContent"></div>
</div>

<div class="overlay hidden" id="activityPanel"><div class="warehouse-panel" id="activityContent"></div></div>
<section class="screen battle-screen hidden" id="battlePanel" aria-label="回合战斗"><div id="battleContent"></div></section>
<!-- 脚本按依赖顺序加载 -->
<script src="engine/rng.js"></script>
<script src="data/gu.js"></script>
<script src="data/food.js"></script>
<script src="data/recipes.js"></script>
<script src="data/regions.js"></script>
<script src="data/aptitude.js"></script>
<script src="data/ranks.js"></script>
<script src="data/essence.js"></script>
<script src="data/cultivation.js"></script>
<script src="data/events.js"></script>
<script src="data/choices.js"></script>
<script src="data/m3.js"></script>
<script src="engine/property.js"></script>
<script src="engine/gu.js"></script>
<script src="engine/events.js"></script>
<script src="engine/cultivation.js"></script>
<script src="engine/condition.js"></script>
<script src="engine/life.js"></script>
<script src="engine/rebirth.js"></script>
<script src="engine/ending.js"></script>
<script src="save.js"></script>
<script src="data/upgrade.js"></script>
<script src="engine/upgrade.js"></script>
<script src="engine/forge.js"></script>
<script src="engine/battle.js"></script>
<script src="data/shop.js"></script>
<script src="engine/shop.js"></script>
<script src="engine/forge-page.js"></script>

<script>
$('btnPause').onclick = togglePause;
$('btnNext').onclick = nextStep;
$('btn1x').onclick = () => setSpeed(800, 'btn1x');
$('btn2x').onclick = () => setSpeed(400, 'btn2x');
$('btn4x').onclick = () => setSpeed(180, 'btn4x');

$('log').addEventListener('click', (e) => {
  if (e.target.closest('.choice-buttons')) return;
  nextStep();
});

renderAttrs();
updateControls();

// 测试用：控制条常驻「测试死亡」按钮，方便验证重生流程（正式发布前可移除）
if (new URLSearchParams(location.search).get('debug') === '1'){
  const dbg = document.createElement('button');
  dbg.textContent = '测试死亡';
  dbg.onclick = () => endGame('（调试）寿元已尽。', '寿终');
  dbg.style.color = 'var(--color-error)';
  $('btnPause').parentElement.appendChild(dbg);
}

// 若有本世存档，首页显示「继续上一世」
if (hasSave()){
  const d = document.createElement('div');
  const cont = document.createElement('button');
  cont.className = 'primary';
  cont.textContent = '继续上一世';
  cont.onclick = continueGame;
  d.appendChild(cont);
  document.querySelector('#screen-start .controls').appendChild(d);
}
</script>
</body>
</html>
